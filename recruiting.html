<!DOCTYPE html>
<html lang="ru">
<head>
<script src="assets/photohr.js"></script>
<script src="assets/qrcode.min.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0f0f13"/>
<title>PhotoHR — Рекрутинг</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0f0f13;--bg2:#16161d;--bg3:#1e1e28;--card:#1a1a23;--card-h:#1f1f2a;
  --border:#2e2e3d;--border2:#3a3a4f;--text:#e8e8f0;--text2:#9090a8;--text3:#5a5a72;
  --accent:#7c6cff;--accent2:#9b8dff;
  --rank1:#3ecf8e;--rank2:#f5a623;--rank3:#f25555;--info:#3aa8d8;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Golos Text',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.hidden{display:none!important}

/* Header (как на остальных страницах) */
.header{padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:600;margin-right:4px}
.logo span{color:var(--accent2)}
.nav-links{display:flex;gap:6px;margin-left:8px}
.header-right{display:flex;gap:8px;align-items:center;margin-left:auto;flex-wrap:wrap}
.user-pill{padding:6px 12px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
.role-dot{width:7px;height:7px;border-radius:50%}
.f-btn{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .15s}
.f-btn:hover{color:var(--text)}
.f-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* Tabs */
.tabs{display:flex;gap:4px;padding:10px 24px 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:61px;background:var(--bg);z-index:40}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;border:none;background:none;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab .cnt{font-size:10px;padding:1px 6px;border-radius:8px;background:var(--bg3);color:var(--text2)}
.tab .cnt.red{background:rgba(242,85,85,.18);color:var(--rank3)}
.tab .cnt:empty{display:none}
.tabs-spacer{flex:1}

/* Buttons & inputs */
.btn{padding:8px 16px;border-radius:10px;border:none;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;justify-content:center;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover:not(:disabled){background:var(--accent2)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2)}.btn-ghost:hover{border-color:var(--border2);color:var(--text)}
.btn-ok{background:rgba(62,207,142,.15);color:var(--rank1);border:1px solid rgba(62,207,142,.3)}
.btn-warn{background:rgba(245,166,35,.12);color:var(--rank2);border:1px solid rgba(245,166,35,.3)}
.btn-danger{background:rgba(242,85,85,.12);color:var(--rank3);border:1px solid rgba(242,85,85,.3)}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-icon{width:34px;height:34px;padding:0;border-radius:9px}
.fin,.fselect{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.fin:focus,.fselect:focus{border-color:var(--accent)}
.fselect option{background:var(--bg2)}
textarea.fin{resize:vertical;min-height:60px}
.fl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.field{margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.muted{color:var(--text3)}
.small{font-size:11px}

/* Filters */
.filters{padding:10px 24px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search-in{padding:7px 12px;border-radius:16px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:13px;outline:none;width:240px}
.search-in:focus{border-color:var(--accent)}
.fchip{padding:5px 10px;border-radius:16px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;cursor:pointer;max-width:200px}
.fchip.on{border-color:var(--accent);color:var(--text);background:rgba(124,108,255,.12)}
select.fchip{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,var(--text3) 50%),linear-gradient(135deg,var(--text3) 50%,transparent 50%);background-position:calc(100% - 12px) 50%,calc(100% - 8px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.filters-toggle{display:none}

/* Layout */
main{padding:16px 24px 90px}
.section-title{font-family:'Unbounded',sans-serif;font-size:13px;font-weight:600;color:var(--text2);margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.empty{padding:28px;text-align:center;color:var(--text3);font-size:13px;border:1px dashed var(--border);border-radius:12px}
.loading{text-align:center;padding:40px;color:var(--text3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px}

/* Today */
.today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;border-left:3px solid var(--border2)}
.tcard.overdue{border-left-color:var(--rank3)}
.tcard.today{border-left-color:var(--rank2)}
.tcard.fresh{border-left-color:var(--accent)}
.tcard-top{display:flex;gap:8px;align-items:flex-start}
.tcard-name{font-weight:600;font-size:14px;cursor:pointer}
.tcard-name:hover{color:var(--accent2)}
.tcard-meta{font-size:11px;color:var(--text2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.due{font-size:11px;font-weight:600;margin-left:auto;white-space:nowrap}
.due.red{color:var(--rank3)}.due.amber{color:var(--rank2)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.stats-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;min-width:120px}
.stat-num{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:600}
.stat-lbl{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:6px;font-size:10px;font-weight:600;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.src{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
.src-hh{background:rgba(255,80,80,.12);color:#ff6b6b}
.src-avito{background:rgba(0,200,120,.12);color:#4ecb8a}
.src-referral{background:rgba(124,108,255,.15);color:var(--accent2)}
.src-telegram{background:rgba(0,136,204,.15);color:#3aa8d8}
.src-manual,.src-other,.src-import{background:rgba(144,144,168,.12);color:var(--text2)}
.src-website{background:rgba(245,166,35,.12);color:var(--rank2)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--bg3);border:1px solid var(--border);color:var(--text2)}
.tag button{border:none;background:none;color:var(--text3);cursor:pointer;font-size:12px;line-height:1}

/* Board */
.funnel{margin-bottom:16px}
.funnel-label{font-family:'Unbounded',sans-serif;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{min-width:240px;width:240px;flex-shrink:0;background:var(--bg2);border-radius:12px;border:1px solid var(--border);display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.col-h{padding:10px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border)}
.col-t{font-size:12px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.col-n{font-size:10px;color:var(--text3);background:var(--bg3);padding:1px 6px;border-radius:6px}
.col-b{padding:6px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:50px;flex:1}
.col-b.over{background:rgba(124,108,255,.08)}
.col-more{font-size:11px;color:var(--text3);text-align:center;padding:6px}
.cc{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 10px;cursor:pointer;transition:border-color .12s,background .12s;position:relative}
.cc:hover{border-color:var(--border2);background:var(--card-h)}
.cc.dragging{opacity:.4;border-color:var(--accent)}
.cc.prio-high{border-left:3px solid var(--rank2)}
.cc-name{font-size:13px;font-weight:500;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}
.cc-row{display:flex;gap:5px;align-items:center;font-size:10px;color:var(--text3);flex-wrap:wrap}
.cc-alarm{color:var(--rank3);font-weight:600}
.cc-soon{color:var(--rank2)}
.cc-quick{position:absolute;top:6px;right:6px;display:flex;gap:4px}
.cc-quick a,.cc-quick button{width:22px;height:22px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.stage-chips{display:none;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.stage-chips::-webkit-scrollbar{display:none}
.stage-chips .fchip{white-space:nowrap;max-width:none;flex-shrink:0;display:inline-flex;align-items:center;gap:5px}

/* List */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:500;color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--bg2);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:var(--bg2);cursor:pointer}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.bulkbar{position:sticky;bottom:12px;margin-top:10px;background:var(--bg3);border:1px solid var(--border2);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--text2)}

/* KPI */
.kpi-funnel{display:flex;flex-direction:column;gap:8px}
.kf-row{display:grid;grid-template-columns:150px 1fr 70px 70px;gap:10px;align-items:center;font-size:12px}
.kf-bar{height:22px;background:var(--bg3);border-radius:6px;overflow:hidden}
.kf-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:6px;min-width:2px}
.kf-num{font-family:'Unbounded',sans-serif;font-size:13px;text-align:right}
.kf-conv{font-size:11px;color:var(--text2);text-align:right}
.spark{display:flex;align-items:flex-end;gap:2px;height:60px}
.spark div{flex:1;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;min-height:1px}

/* Drawer */
.drawer-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100}
.drawer-bg.open{display:block}
.drawer{position:fixed;top:0;right:0;width:520px;max-width:100vw;height:100vh;background:var(--bg2);border-left:1px solid var(--border);z-index:101;overflow-y:auto;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer-bg.open .drawer{transform:translateX(0)}
.dr-head{padding:16px 18px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2}
.dr-close{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;font-size:16px}
.dr-name{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:600;padding-right:40px;margin-bottom:6px}
.dr-body{padding:14px 18px 40px}
.dr-section{margin-bottom:18px}
.dr-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dr-label .btn{text-transform:none;letter-spacing:0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;font-size:13px}
.kv .k{color:var(--text3);font-size:12px}
.kv a{color:var(--accent2)}
.timeline{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:8px;font-size:12px}
.ev-ic{width:24px;height:24px;border-radius:7px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px}
.ev-b{flex:1;min-width:0}
.ev-t{white-space:pre-wrap;word-wrap:break-word;line-height:1.4}
.ev-d{color:var(--text3);font-size:10px;margin-top:2px}
.rem{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:var(--bg3);margin-bottom:6px;font-size:12px}
.rem.over{border:1px solid rgba(242,85,85,.4)}
.file{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;background:var(--bg3);margin-bottom:6px;font-size:12px}
.file .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--accent2)}

/* Modal / sheet */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:18px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:760px}
.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-family:'Unbounded',sans-serif;font-size:14px;font-weight:600}
.modal-x{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}

/* Settings */
.conn{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.conn-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.conn-h{display:flex;align-items:center;gap:10px}
.conn-logo{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.state{padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600;margin-left:auto}
.state-connected{background:rgba(62,207,142,.15);color:var(--rank1)}
.state-error{background:rgba(242,85,85,.15);color:var(--rank3)}
.state-not_configured,.state-disconnected{background:var(--bg3);color:var(--text2)}
code,.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
.howto{font-size:12px;color:var(--text2);line-height:1.55}
.howto ol{padding-left:18px}

/* Toast, FAB */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:9px 18px;font-size:13px;z-index:500;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.toast.error{border-color:rgba(242,85,85,.4);color:var(--rank3)}
.fab{display:none;position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:28px;box-shadow:0 8px 24px rgba(124,108,255,.45);z-index:60;cursor:pointer}
.admin-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;display:none;padding:0}
.admin-iframe{width:960px;max-width:96vw;height:90vh;border:none;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}

/* Interns funnel */
.chk-group{margin-bottom:8px}
.chk-stage{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin:6px 0 4px}
.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;font-size:12px;background:var(--bg3);margin-bottom:4px}
.chk.st-due{border:1px solid rgba(245,166,35,.45)}
.chk.st-done{opacity:.7}
.chk.st-skipped{opacity:.45}
.chk input{margin-top:2px;accent-color:var(--rank1)}
.chk .who{margin-left:auto;font-size:10px;color:var(--text3);white-space:nowrap}
.out{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:7px 10px;border-radius:9px;background:var(--bg3);margin-bottom:6px;font-size:12px}
.out .st{font-weight:600}
.out .st.done{color:var(--rank1)}.out .st.no_show,.out .st.cancelled{color:var(--rank3)}.out .st.booked{color:var(--rank2)}
.qr-box{background:#fff;border-radius:14px;padding:14px;display:flex;justify-content:center;align-items:center;min-height:280px;margin:0 auto 10px;max-width:320px}
.qr-box img,.qr-box canvas{max-width:100%;height:auto}
.qr-name{font-family:'Unbounded',sans-serif;font-size:18px;text-align:center;margin-bottom:8px}
.slot-day{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:10px;min-width:180px}
.slot-days{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.slot{display:flex;justify-content:space-between;gap:6px;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--border)}
.slot>span:last-child{white-space:nowrap}
.slot:last-child{border-bottom:none}
.free{font-weight:600;color:var(--rank1)}.full{color:var(--rank3)}
.tpl-text{white-space:pre-wrap;font-size:13px;line-height:1.5;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;min-height:120px;width:100%;color:var(--text);font-family:inherit}
.att td{vertical-align:middle}
.att input[type=checkbox]{width:18px;height:18px;accent-color:var(--rank1)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:8px;font-size:10px;background:var(--bg3);color:var(--text2)}
.pill.ok{background:rgba(62,207,142,.15);color:var(--rank1)}

@media(max-width:768px){
  .header{padding:10px 14px;gap:8px;padding-top:max(10px,env(safe-area-inset-top))}
  .nav-links{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;margin-left:0}
  .nav-links::-webkit-scrollbar{display:none}
  .header-right .btn-ghost.hide-m{display:none}
  .tabs{padding:6px 10px 0;top:0;position:relative}
  .tabs .btn{display:none}
  .filters{padding:8px 12px}
  .filters .fx{display:none}
  .filters.open .fx{display:inline-flex}
  .filters-toggle{display:inline-flex}
  .search-in{width:100%;flex:1 1 100%}
  main{padding:12px 12px 100px}
  .today-grid{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .board-desktop .board{display:block}
  .board-desktop .col{display:none;width:100%;min-width:0;max-height:none}
  .board-desktop .col.m-active{display:flex}
  .stage-chips{display:flex}
  .funnel-label{display:none}
  .drawer{width:100vw}
  .dr-head{position:static;padding-top:max(16px,env(safe-area-inset-top))}
  .dr-head .actions .btn{flex:1 1 auto}

<!-- Чистые функции страницы (без DOM и сети) — их проверяют tests/recruiting.test.cjs -->
<script id="recruiting-core">
(function (root) {
  'use strict';
  const R = {};
  R.esc = s => s == null ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  R.color = c => /^#[0-9a-fA-F]{6}$/.test(String(c || '')) ? c : '#7c6cff';
  R.digits = p => String(p || '').replace(/\D/g, '');
  R.ruDigits = p => {
    const d = R.digits(p);
    if (d.length === 11 && (d[0] === '8' || d[0] === '7')) return '7' + d.slice(1);
    if (d.length === 10) return '7' + d;
    return d;
  };
  R.telHref = p => { const d = R.ruDigits(p); return d.length >= 5 ? 'tel:+' + d : null; };
  R.waHref = p => { const d = R.ruDigits(p); return d.length >= 10 ? 'https://wa.me/' + d : null; };
  R.tgHref = t => {
    const s = String(t || '').trim();
    const m = s.match(/^(?:https?:\/\/)?(?:t\.me\/|telegram\.me\/)?@?([A-Za-z][A-Za-z0-9_]{4,31})$/);
    return m ? 'https://t.me/' + m[1] : null;
  };
  R.safeUrl = u => /^https?:\/\//i.test(String(u || '')) ? String(u) : null;
  R.FILTER_KEYS = ['q', 'recruiter', 'source', 'city', 'vacancy_id', 'target_role', 'tag', 'stage_id', 'date_from', 'date_to', 'overdue', 'no_contact', 'imported'];
  R.filtersToQuery = f => {
    const p = new URLSearchParams();
    for (const k of R.FILTER_KEYS) if (f && f[k] != null && f[k] !== '' && f[k] !== false) p.set(k, String(f[k]));
    return p.toString();
  };
  R.countFilters = f => R.FILTER_KEYS.filter(k => k !== 'q' && f && f[k] != null && f[k] !== '').length;
  R.pad = n => String(n).padStart(2, '0');
  R.toLocalInput = d => `${d.getFullYear()}-${R.pad(d.getMonth() + 1)}-${R.pad(d.getDate())}T${R.pad(d.getHours())}:${R.pad(d.getMinutes())}`;
  R.dateOnly = d => `${d.getFullYear()}-${R.pad(d.getMonth() + 1)}-${R.pad(d.getDate())}`;
  // Quick choices for «перезвонить»: local time of the recruiter's phone.
  R.PRESETS = [['h1', 'Через час'], ['h3', 'Через 3 часа'], ['eve', 'Вечером, 18:00'], ['tom10', 'Завтра, 10:00'], ['tom15', 'Завтра, 15:00'],
    ['day2', 'Послезавтра'], ['week', 'Через неделю'], ['month', 'Через месяц'], ['newyear', 'К ёлкам (1 ноя)'], ['summer', 'К лету (1 мая)']];
  R.presetDate = (kind, now = new Date()) => {
    const d = new Date(now.getTime());
    const at = (days, h, m = 0) => { const x = new Date(now.getTime()); x.setDate(x.getDate() + days); x.setHours(h, m, 0, 0); return x; };
    switch (kind) {
      case 'h1': d.setMinutes(d.getMinutes() + 60, 0, 0); return d;
      case 'h2': d.setMinutes(d.getMinutes() + 120, 0, 0); return d;
      case 'h3': d.setMinutes(d.getMinutes() + 180, 0, 0); return d;
      case 'eve': { const x = at(0, 18); return x > now ? x : at(1, 18); }
      case 'tom10': return at(1, 10);
      case 'tom15': return at(1, 15);
      case 'day2': return at(2, 10);
      case 'week': return at(7, 10);
      case 'month': return at(30, 10);
      case 'newyear': case 'summer': {
        const month = kind === 'newyear' ? 10 : 4;
        const x = new Date(now.getFullYear(), month, 1, 10, 0, 0, 0);
        if (x <= now) x.setFullYear(x.getFullYear() + 1);
        return x;
      }
      default: return null;
    }
  };
  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  R.fmtDate = v => { if (!v) return ''; const d = new Date(v); return isNaN(d) ? '' : `${d.getDate()} ${MONTHS[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; };
  R.fmtTime = v => { const d = new Date(v); return isNaN(d) ? '' : `${R.pad(d.getHours())}:${R.pad(d.getMinutes())}`; };
  R.fmtDateTime = v => v ? `${R.fmtDate(v)}, ${R.fmtTime(v)}` : '';
  R.ago = (v, now = Date.now()) => {
    if (!v) return '';
    const m = Math.floor((now - new Date(v).getTime()) / 60000);
    if (m < 1) return 'только что';
    if (m < 60) return m + ' мин';
    const h = Math.floor(m / 60);
    if (h < 24) return h + ' ч';
    const d = Math.floor(h / 24);
    return d < 60 ? d + ' дн' : Math.floor(d / 30) + ' мес';
  };
  // «просрочено 2 ч» / «сегодня 15:00» / «завтра 10:00» / «12 ноя, 10:00»
  R.dueLabel = (v, now = new Date()) => {
    const d = new Date(v);
    if (isNaN(d)) return { text: '', cls: '' };
    if (d < now) return { text: 'просрочено ' + R.ago(d, now.getTime()), cls: 'red' };
    const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
    const diff = Math.round((day(d) - day(now)) / 86400000);
    if (diff === 0) return { text: 'сегодня ' + R.fmtTime(d), cls: 'amber' };
    if (diff === 1) return { text: 'завтра ' + R.fmtTime(d), cls: '' };
    return { text: R.fmtDateTime(d), cls: '' };
  };
  R.pct = (a, b) => (a ? Math.round((b / a) * 1000) / 10 + '%' : '—');
  R.SRC = { hh: 'hh.ru', avito: 'Авито', telegram: 'Telegram', website: 'Сайт', referral: 'Рекомендация', manual: 'Вручную', import: 'Импорт', other: 'Другое' };
  R.ROLE = { photographer: 'Фотограф', aquagrim: 'Аквагримёр', admin: 'Администратор', manager: 'Менеджер', other: 'Другое' };
  // KPI steps (interns funnel 7 Nov): keys are kept from Recruiting 2, labels follow the scheme.
  R.STEP = { response: 'Отклик', call: 'Звонок', interview: 'Приглашён', training: 'Тренинг ч.1', trainee: 'Стажёр (2 части)',
    internship: 'Записан на стажировку', outing_1: 'Выход 1', outing_2: 'Выход 2', outing_3: 'Выход 3', hired: 'Передан в HR', rejected: 'Отказ', reserve: 'Резерв' };
  R.CALL = { reached: 'Дозвонился', no_answer: 'Не ответил', busy: 'Занято', wrong_number: 'Неверный номер', callback: 'Просил перезвонить', declined: 'Отказался' };
  R.CTYPE = { note: '📝', call: '📞', no_answer: '📵', message_sent: '💬', interview: '🤝', system: '⚙' };
  R.KIND = { call: 'Позвонить', message: 'Написать', interview: 'Собеседование', meeting: 'Встреча', other: 'Другое' };
  R.FUNNEL = { hiring: 'Отклик и тренинг', internship: 'Стажировка', rejected: 'Отказы и резерв' };
  R.CHANNEL = { hh: 'hh.ru', avito: 'Авито', telegram: 'Telegram', max: 'MAX', whatsapp: 'WhatsApp', phone: 'Телефон', email: 'Почта', other: 'Другое' };
  R.WHO = { recruiter: 'Рекрутер', trainer: 'Тренер', venue_manager: 'Менеджер площадки' };
  R.OUT = { booked: 'записан', done: 'был ✓', no_show: 'не пришёл', cancelled: 'отменён' };
  R.TEMPLATES = { invite_interview: 'Приглашение на собеседование', invite_training: 'Приглашение на тренинг', after_day1: 'После 1-го дня', who_is_who: 'Кто чем занимается' };
  R.CODE_ORDER = ['response', 'invited', 'training_1', 'trainee', 'booked', 'outing_1', 'outing_2', 'outing_3', 'handover'];
  // Channel of the conversation: set by hand, otherwise from the source of the response.
  R.channelOf = c => (c && c.contact_channel) || ({ hh: 'hh', avito: 'avito', telegram: 'telegram' })[c && c.source] || (c && c.telegram ? 'telegram' : c && c.phone ? 'phone' : null);
  R.channelHref = (ch, c) => {
    const link = String((c && c.contact_link) || '').trim();
    switch (ch) {
      case 'telegram': return R.tgHref(link) || R.tgHref(c && c.telegram) || R.safeUrl(link);
      case 'whatsapp': return R.safeUrl(link) || R.waHref(link) || R.waHref((c && (c.whatsapp || c.phone)) || '');
      case 'phone': return R.telHref(link) || R.telHref(c && c.phone);
      case 'email': { const e = /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(link) ? link : (c && c.email) || ''; return e ? 'mailto:' + e : null; }
      default: return R.safeUrl(link) || (ch === 'hh' || ch === 'avito' ? R.safeUrl(c && c.source_url) : null);
    }
  };
  // First name for messages: «Петрова Ирина» → Ирина, «Ирина Петрова» → Ирина, «Иванов Иван Иванович» → Иван.
  const NOT_SURNAMES = new Set(['ирина', 'марина', 'екатерина', 'полина', 'алина', 'кристина', 'валентина', 'ангелина', 'карина', 'галина', 'нина',
    'регина', 'арина', 'дарина', 'константин', 'валентин', 'вениамин', 'мартин', 'лев', 'яков', 'любовь']);
  const surnameLike = w => /(ов|ова|ев|ева|ёв|ёва|ин|ина|ын|ына|ский|ская|цкий|цкая|ко|ук|юк|ян|дзе|швили|их|ых)$/i.test(w) && !NOT_SURNAMES.has(w.toLowerCase());
  R.firstName = name => {
    const w = String(name || '').trim().split(/\s+/).filter(Boolean);
    if (w.length < 2) return w[0] || '';
    return surnameLike(w[0]) && !surnameLike(w[1]) ? w[1] : w[0];
  };
  // {имя}, {дата_тренинга}… — unknown or empty placeholders become «…» so a draft never goes out half-filled silently.
  R.renderTemplate = (tpl, vars) => String(tpl || '').replace(/\{([0-9a-zа-яё_]+)\}/gi, (m, k) => (vars && vars[k] != null && vars[k] !== '' ? String(vars[k]) : '…'));
  const WD = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  R.dayLabel = v => { if (!v) return ''; const d = new Date(String(v).slice(0, 10) + 'T12:00:00'); return isNaN(d) ? '' : `${WD[d.getDay()]} ${R.fmtDate(d)}`; };
  R.templateVars = (c, settings, me) => {
    const i = (c && c.intern) || {};
    const next = (i.outings || []).filter(o => o.status === 'booked').sort((a, b) => a.date.localeCompare(b.date))[0];
    const last = (i.outings || []).filter(o => o.status === 'done').sort((a, b) => b.date.localeCompare(a.date))[0];
    const tr = i.training || {};
    return { имя: R.firstName(c && c.name), рекрутер: R.firstName((c && c.assigned_to_name) || (me && me.name) || ''),
      дата_тренинга: tr.date ? R.dayLabel(tr.date) : '', время_тренинга: tr.time || '', место_тренинга: tr.place || '', тренер: tr.trainer_name || '',
      дата: next ? R.dayLabel(next.date) : '', площадка: (last || next || {}).venue_name || '',
      ссылка_бот: settings && settings.laika_bot ? 'https://t.me/' + settings.laika_bot : '', чат_стажёров: (settings && settings.intern_chat_url) || '' };
  };
  // Checklist grouped by the stage it belongs to, in funnel order.
  R.checklistGroups = list => {
    const groups = [];
    for (const item of list || []) {
      let g = groups.find(x => x.stage === item.stage);
      if (!g) { g = { stage: item.stage, items: [] }; groups.push(g); }
      g.items.push(item);
    }
    return groups.sort((a, b) => R.CODE_ORDER.indexOf(a.stage) - R.CODE_ORDER.indexOf(b.stage));
  };
  // Tasks of one person together (one card per candidate on «Сегодня»), order kept.
  R.groupTasks = tasks => {
    const out = [];
    for (const t of tasks || []) {
      let g = out.find(x => x.candidate_id === t.candidate_id);
      if (!g) { g = { candidate_id: t.candidate_id, items: [] }; out.push(g); }
      g.items.push(t);
    }
    return out;
  };
  R.svgSrc = svg => /^<svg[\s>]/.test(String(svg || '')) ? 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg) : null;
  // Card timeline: stage moves, comments/calls and finished reminders, newest first.
  R.timeline = c => {
    const ev = [];
    for (const s of c.stage_log || []) ev.push({ at: s.created_at, icon: '➜', text: (s.from_stage_name ? s.from_stage_name + ' → ' : '') + (s.to_stage_name || ''), note: s.notes, who: s.moved_by_name });
    for (const m of c.comments || []) ev.push({ at: m.created_at, icon: R.CTYPE[m.comment_type] || '📝', text: m.body, who: m.author_name, call: m.call_result ? R.CALL[m.call_result] : null });
    for (const r of c.reminders || []) if (r.status !== 'open' && r.done_at) ev.push({ at: r.done_at, icon: r.status === 'done' ? '✅' : '✖', text: (R.KIND[r.kind] || 'Напоминание') + (r.result ? ': ' + r.result : ''), who: r.assigned_to_name });
    return ev.sort((a, b) => new Date(b.at) - new Date(a.at));
  };
  // Next working stage after the current one (same order as the board, skipping terminal stages).
  R.nextStage = (stages, current) => {
    const live = stages.filter(s => s.is_active !== false && !s.is_terminal).sort((a, b) => a.sort_order - b.sort_order);
    const i = live.findIndex(s => s.id === current);
    return i >= 0 && i + 1 < live.length ? live[i + 1] : null;
  };
  R.rejectStage = (stages, current) => {
    const rej = stages.filter(s => s.terminal_type === 'rejected' && s.is_active !== false).sort((a, b) => a.sort_order - b.sort_order);
    if (rej.length === 1) return rej[0];
    if (!rej.length) return null;
    const cur = stages.find(s => s.id === current);
    const step = cur && cur.kpi_step;
    const pick = re => rej.find(s => re.test(s.name));
    if (step === 'internship') return pick(/стаж/i) || rej[rej.length - 1];
    if (step === 'training' || step === 'interview') return pick(/обуч|тренинг|собесед/i) || rej[0];
    return pick(/отклик/i) || rej[0];
  };
  root.R2 = R;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
'use strict';
const API = PhotoHR.API;
const R = window.R2;
const esc = R.esc;
let accessToken = localStorage.getItem('fhr_access') || null;
let refreshToken = localStorage.getItem('fhr_refresh') || null;
let refreshLock = null;
let currentUser = null;
let mgmtNavHasAccess = false;
let META = null;
const state = { tab: 'today', filters: {}, list: { offset: 0, sort: 'created_desc', selected: new Set() }, mobileStage: null, card: null, kpi: { period: '30', internBy: 'week' },
  helper: false, trainer: { training: null }, interns: { days: 14 } };

const ROLE_LABELS = { admin: 'Администратор', super_admin: 'Суперадмин', exec_director: 'Исполнительный директор', hr_director: 'HR-директор',
  hr_manager: 'HR-менеджер', recruiter: 'Рекрутер', tech_director: 'Тех-директор', site_specialist: 'Специалист по сайту', cashier: 'Инкассация',
  photographer_user: 'Сотрудник', aq_user: 'Аквагримёр', aq_manager: 'Менеджер аквагрима', archived: 'Архив' };
const ROLE_COLORS = { admin: '#ffd700', super_admin: '#c084fc', exec_director: '#f5a623', hr_director: '#3ecf8e', hr_manager: '#4ecb8a', recruiter: '#e86aa6' };
const hasAnyRole = roles => currentUser?.role === 'super_admin' || roles.includes(currentUser?.role);
const isLead = () => !!META?.me?.is_lead;
const internsOn = () => !!META?.interns?.enabled;
const SETTINGS = () => (META && META.interns && META.interns.settings) || {};
const stageByCode = code => (META?.stages || []).find(s => s.code === code && s.is_active !== false);

// ── API ──
async function api(method, path, body, { raw = false, form = null } = {}) {
  const opts = { method, headers: {} };
  if (form) opts.body = form; else if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  if (accessToken) opts.headers.Authorization = 'Bearer ' + accessToken;
  let res = await PhotoHR.fetch(API + path, opts);
  if (res.status === 401 && refreshToken) {
    try {
      if (!refreshLock) {
        refreshLock = (async () => {
          const rr = await PhotoHR.fetch(API + '/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken }) });
          if (!rr.ok) throw new Error('refresh_failed');
          const d = await rr.json();
          accessToken = d.accessToken; refreshToken = d.refreshToken;
          localStorage.setItem('fhr_refresh', refreshToken); localStorage.setItem('fhr_access', accessToken);
        })();
      }
      await refreshLock;
      opts.headers.Authorization = 'Bearer ' + accessToken;
      res = await PhotoHR.fetch(API + path, opts);
    } catch { doLogout(); return null; } finally { refreshLock = null; }
  }
  if (raw) { if (!res.ok) throw new Error('Не удалось получить файл'); return res; }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || 'Ошибка'); e.status = res.status; e.data = data; throw e; }
  return data;
}
function doLogout() { localStorage.removeItem('fhr_refresh'); localStorage.removeItem('fhr_access'); window.location.href = 'index.html'; }

function bindDnD(root) {
  let dragged = null;
  root.querySelectorAll('.cc[draggable]').forEach(card => {
    card.addEventListener('dragstart', e => { dragged = card.dataset.id; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragged); });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); root.querySelectorAll('.over').forEach(x => x.classList.remove('over')); });
  });
  root.querySelectorAll('.col-b').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); if (dragged) moveFlow(dragged, col.dataset.stage); dragged = null; });
  });
}

// Moving: special stages ask for details (training / internship / rejection / hire).
async function moveFlow(id, stageId, after) {
  const st = stageById(stageId);
  if (!st) return;
  if (st.terminal_type === 'rejected' || st.terminal_type === 'reserve') return openReject(id, stageId, after, st.terminal_type === 'reserve');
  if (st.terminal_type === 'hired') {
    const card = state.card && state.card.id === id ? state.card : null;
    const txt = card && card.intern && card.intern.trainee_card
      ? `«${st.name}»: карточка стажёра «${card.intern.trainee_card.name}» станет карточкой сотрудника (испытательный срок). Продолжить?`
      : `«${st.name}»: будет создана карточка сотрудника (испытательный срок). Продолжить?`;
    if (!confirm(txt)) return;
  }
  if (st.auto_action === 'pick_outing' && internsOn()) return openOutingPicker(id, stageId, after);
  // Stage action from settings; the old page's stage names keep working without settings.
  const isTraining = st.auto_action === 'pick_training' || (!st.auto_action && st.name === 'Приглашен на обучение');
  const isIntern = st.auto_action === 'pick_internship' || (!st.auto_action && ['Назначена стажировка', 'Ожидает стажировку'].includes(st.name));
  if (isTraining || isIntern) return pickTraining(id, stageId, isIntern, after);
  await doMove(id, stageId, {}, after);
}
async function doMove(id, stageId, extra = {}, after) {
  try {
    const r = await api('POST', `/candidates/${id}/move`, { stage_id: stageId, ...extra });
    toast(r.converted ? (r.reused_trainee_card ? '🎉 Передан в HR — карточка стажёра стала карточкой сотрудника' : '🎉 Передан в HR — карточка сотрудника создана')
      : 'Перемещён: ' + (stageById(stageId)?.name || ''));
    await refreshAfterChange(id);
    if (after) after();
  } catch (e) { toast(e.message, true); }
}
async function refreshAfterChange(id) {
  if (state.card && state.card.id === id && $('drawer-bg').classList.contains('open')) await openCard(id, true);
  if (state.tab === 'board') loadBoard(); else if (state.tab === 'list') loadList(); else if (state.tab === 'today') loadToday();
  refreshTodayCount();
}

// ── LIST ──

function updateBulkbar() {
  const b = $('bulkbar'); if (!b) return;
  b.classList.toggle('hidden', !state.list.selected.size);
  b.querySelector('b').textContent = 'Выбрано: ' + state.list.selected.size;
}
async function bulkMove(stageId) {
  if (!stageId) return;
  const st = stageById(stageId);
  if (!confirm(`Перевести ${state.list.selected.size} кандидатов на «${st ? st.name : ''}»?`)) return;
  try {
    const r = await api('POST', '/candidates/bulk-move', { candidate_ids: [...state.list.selected], stage_id: stageId });
    toast(`Переведено: ${r.moved}${r.skipped ? `, пропущено: ${r.skipped}` : ''}`);
    state.list.selected.clear(); loadList();
  } catch (e) { toast(e.message, true); }
}
async function bulkUpdate(body) {
  try {
    const r = await api('POST', '/candidates/bulk-update', { candidate_ids: [...state.list.selected], ...body });
    toast('Обновлено: ' + r.updated); state.list.selected.clear(); loadList();
  } catch (e) { toast(e.message, true); }
}

    document.body.style.overflow = 'hidden';

}

async function addTag(c, value) {
  const t = String(value || '').trim().replace(/^#/, '');
  if (!t) return;
  try { await api('PATCH', `/candidates/${c.id}`, { tags: [...(c.tags || []), t] }); await openCard(c.id, true); } catch (e) { toast(e.message, true); }
}
async function addComment(id) {
  const body = $('cm-body').value.trim();
  if (!body) return;
  try { await api('POST', `/candidates/${id}/comments`, { body, comment_type: $('cm-type').value }); await openCard(id, true); } catch (e) { toast(e.message, true); }
}
async function uploadFile(id, file) {
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { toast('Файл больше 10 МБ', true); return; }
  const form = new FormData(); form.append('file', file); form.append('kind', 'resume');
  try { await api('POST', `/candidates/${id}/files`, undefined, { form }); toast('Файл загружен'); await openCard(id, true); } catch (e) { toast(e.message, true); }
}
async function downloadFile(fileId, name) {
  try {
    const res = await api('GET', `/recruiting/files/${fileId}`, undefined, { raw: true });
    const url = URL.createObjectURL(await res.blob());
    const a = document.createElement('a'); a.href = url; a.download = name || 'file'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  } catch (e) { toast(e.message, true); }
}

  try {

    if (result === 'no_answer') body.next_reminder = { due_at: R.presetDate('h2').toISOString(), kind: 'call', note: 'Не ответил — повторный звонок' };
    await api('POST', `/candidates/${candidateId}/comments`, body);

function openReject(id, stageId, after, reserve = false) {
  const c = state.card && state.card.id === id ? state.card : null;
  const type = reserve ? 'reserve' : 'rejected';
  const stages = META.stages.filter(s => s.terminal_type === type && s.is_active !== false);
  const guess = stageId || (reserve ? (stages[0] || {}).id : (R.rejectStage(META.stages, c ? c.stage_id : null) || {}).id);
  const s = SETTINGS();
  const reasons = (reserve ? s.reserve_reasons : s.reject_reasons) || ['Кандидат отказался сам', 'Не вышел на связь', 'Не пришёл', 'Не подходит по навыкам',

async function confirmReject(id) {
  const stageId = $('j-stage').value;
  if (!stageId) { toast('Нет этапа отказа — добавьте его в настройках', true); return; }
  const note = $('j-reason').value + ($('j-comment').value.trim() ? ': ' + $('j-comment').value.trim() : '');
  const ret = $('j-return').value;
  try {
    await api('POST', `/candidates/${id}/move`, { stage_id: stageId, notes: note, rejection_code: $('j-reason').value });
    if (ret) await api('POST', `/candidates/${id}/reminders`, { due_at: R.presetDate(ret).toISOString(), kind: 'call', note: 'Вернуться после отказа: ' + note.slice(0, 200) });
    closeModal(); toast((stageById(stageId)?.terminal_type === 'reserve' ? 'В резерве' : 'Отказ сохранён') + (ret ? ', напоминание поставлено' : ''));
    refreshAfterChange(id);
    if (state.afterReject) state.afterReject();
  } catch (e) { toast(e.message, true); }
}

async function loadKpi() {
  const el = $('view-kpi');
  const k = state.kpi;
  const to = new Date(); let from;
  if (k.period === 'custom' && k.from) from = new Date(k.from);
  else if (k.period === 'month') from = new Date(to.getFullYear(), to.getMonth(), 1);
  else from = new Date(Date.now() - Number(k.period || 30) * 86400000);
  const params = new URLSearchParams({ from: R.dateOnly(from), to: k.period === 'custom' && k.to ? k.to : R.dateOnly(to) });
  for (const key of ['source', 'recruiter', 'vacancy_id', 'city', 'target_role']) if (k[key]) params.set(key, k[key]);
  el.innerHTML = '<div class="loading">Считаю…</div>';
  try {
    const d = await api('GET', '/recruiting/kpi?' + params);
    const steps = META.kpi_steps;
    const max = d.funnel.response || 1;
    const tableBy = (rows, title, labelFn) => rows.length ? `<div class="panel"><div class="section-title" style="margin-top:0">${title}</div><div class="tbl-wrap"><table class="tbl">
      <thead><tr><th></th>${steps.map(s => `<th class="num">${esc(R.STEP[s])}</th>`).join('')}<th class="num">Отклик→найм</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${labelFn(r)}</td>${steps.map(s => `<td class="num">${r[s]}</td>`).join('')}<td class="num"><b>${r.hire_rate == null ? '—' : r.hire_rate + '%'}</b></td></tr>`).join('')}</tbody></table></div></div>` : '';
    const dmax = Math.max(1, ...d.daily.map(x => x.responses));

async function importCommit() {
  const job = state.importJob; if (!job) return;
  const stageSel = $('imp-stage').value;
  const body = { duplicates: $('imp-dups').value, tags: $('imp-tag').value ? [$('imp-tag').value] : [], assign_to: $('imp-assign').value || null,
    stage_mode: stageSel.startsWith('stage:') ? 'stage' : stageSel, stage_id: stageSel.startsWith('stage:') ? stageSel.slice(6) : null };
  if (!confirm(`Загрузить ${job.counts.new} новых кандидатов${body.duplicates === 'fill' ? ` и дополнить ${job.counts.duplicate_base} существующих` : ''}?`)) return;
  try {
    await api('POST', `/recruiting/import/${job.job_id}/commit`, body);
    const prog = $('imp-progress');
    const poll = async () => {
      const j = await api('GET', `/recruiting/import/${job.job_id}`);
      const p = (j.stats && j.stats.progress) || {};
      if (prog) prog.textContent = j.status === 'committing' ? `⏳ ${p.processed || 0} из ${p.to_process || '…'}` : '';
      if (j.status === 'committing') return setTimeout(poll, 1500);
      if (j.status === 'committed') { toast(`✅ Загружено: ${j.stats.result.created}, дополнено: ${j.stats.result.filled}`); state.importJob = null; META = await api('GET', '/recruiting/meta'); fillFilterControls(); renderImport(); }
      else toast((j.stats && j.stats.error) || 'Импорт не завершён', true);
    };
    poll();
  } catch (e) { toast(e.message, true); }
}

async function merge(group, ids) {
  const target = document.querySelector(`input[name="dg-${group}"]:checked`).value;
  const sources = ids.split(',').filter(x => x !== target);
  if (!confirm(`Объединить ${sources.length + 1} карточки в одну? Отменить нельзя (история сохранится в основной).`)) return;
  try { const r = await api('POST', '/recruiting/duplicates/merge', { target_id: target, source_ids: sources }); toast('Объединено: ' + r.merged); loadDupes(); }
  catch (e) { toast(e.message, true); }
}

async function moveStage(i, dir) {
  const arr = META.stages.slice().sort((a, b) => a.sort_order - b.sort_order);
  const j = i + dir; if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  try { await api('POST', '/recruiting/stages/reorder', { order: arr.map((s, k) => ({ id: s.id, sort_order: (k + 1) * 10 })) }); META = await api('GET', '/recruiting/meta'); loadSettings(); }
  catch (e) { toast(e.message, true); }
}
async function integration(act, p) {
  const out = $('int-result');
  try {
    if (act === 'int-check') { const r = await api('POST', `/recruiting/integrations/${p}/check`); toast(r.ok ? '✅ Связь есть' : '⚠ ' + (r.message || 'ошибка'), !r.ok); }
    if (act === 'int-off') { if (!confirm('Отключить hh.ru? Токены будут удалены.')) return; await api('POST', `/recruiting/integrations/${p}/disconnect`); toast('Отключено'); }
    if (act === 'int-dry' || act === 'int-sync') {
      out.innerHTML = '<div class="loading">Связываюсь с площадкой…</div>';
      const r = await api('POST', `/recruiting/integrations/${p}/sync`, { dry_run: act === 'int-dry' });
      const st = r.stats;
      out.innerHTML = `<div class="panel" style="margin-top:12px"><div class="section-title" style="margin-top:0">${act === 'int-dry' ? 'Предпросмотр (ничего не записано)' : 'Загрузка завершена'}</div>
        <div class="small">Увидела откликов: <b>${st.seen}</b> · уже были: ${st.known} · ${act === 'int-dry' ? `будет новых: <b>${st.would_create}</b>` : `новых: <b>${st.created}</b>, повторных: ${st.repeat}, ошибок: ${st.errors}`}${st.no_contacts ? ` · без контактов: ${st.no_contacts}` : ''}</div>
        ${r.preview && r.preview.length ? `<div class="tbl-wrap" style="margin-top:8px"><table class="tbl"><thead><tr><th>Имя</th><th>Телефон</th><th>Почта</th><th>Город</th><th>Резюме</th></tr></thead><tbody>
          ${r.preview.map(x => `<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${esc(x.city || '')}</td><td>${x.has_resume_text ? 'есть' : '—'}</td></tr>`).join('')}</tbody></table></div>
          <div class="small muted" style="margin-top:6px">Данные замаскированы — это проверка, что поля распознаются.</div>` : ''}</div>`;
    }
    if (act !== 'int-dry' && act !== 'int-sync') loadSettings();
  } catch (e) { if (out) out.innerHTML = ''; toast(e.message, true); }
}

    closeModal(); toast('Записан: ' + R.dayLabel(date));
    await refreshAfterChange(id);
    if (state.afterPick) state.afterPick();
    if (state.tab === 'interns') loadInterns();
  } catch (e) { toast(e.message, true); }
}

// QR for the Telegram booking: one-time link per person; «по очереди» goes through everybody without Telegram.
async function openTgQr(ids, idx = 0, names = {}) {
  state.qr = { ids, idx, names };
  const id = ids[idx];
  modal(`${modalHead('📱 Запись на стажировку в Telegram')}
    <div class="qr-name">${esc(names[id] || (state.card && state.card.id === id ? state.card.name : ''))}</div>
    <div class="qr-box" id="qr-box"><div class="loading">Готовлю QR…</div></div>
    <div class="small muted" style="text-align:center" id="qr-status">Наведите камеру телефона — откроется бот Лайки, там выбрать дату. Ссылка одноразовая, 3 дня.</div>
    <div class="modal-footer">${ids.length > 1 ? `<span class="muted small" style="margin-right:auto">${idx + 1} из ${ids.length}</span>
      <button class="btn btn-ghost" data-act="qr-step" data-dir="-1" ${idx ? '' : 'disabled'}>←</button><button class="btn btn-ghost" data-act="qr-step" data-dir="1" ${idx < ids.length - 1 ? '' : 'disabled'}>→</button>` : ''}
      <button class="btn btn-ghost" data-act="close-modal">Готово</button></div>`);
  try {
    const t = await api('POST', `/recruiting/trainer/candidates/${id}/telegram-token`);
    drawQr('qr-box', t.url, t.qr_svg);
    if (t.already_linked) $('qr-status').textContent = 'Уже записан в боте — новый QR нужен, только если сменил телефон.';
    pollToken(t.id, id);
  } catch (e) { $('qr-box').innerHTML = `<div style="color:#c33">${esc(e.message)}</div>`; }
}
function drawQr(boxId, url, svg) {
  const box = $(boxId);
  if (!box) return;
  box.innerHTML = '';
  if (window.QRCode) {
    try { new QRCode(box, { text: url, width: 260, height: 260, colorDark: '#000000', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M }); return; } catch { box.innerHTML = ''; }
  }
  const src = R.svgSrc(svg);
  if (src) { const img = document.createElement('img'); img.src = src; img.alt = 'QR'; img.width = 260; box.appendChild(img); }
  else box.textContent = url;
}
function pollToken(tokenId, candidateId) {
  clearInterval(state.qrTimer);
  const started = Date.now();
  state.qrTimer = setInterval(async () => {
    if (!$('qr-box') || Date.now() - started > 10 * 60e3) { clearInterval(state.qrTimer); return; }
    try {
      const st = await api('GET', `/recruiting/trainer/tokens/${tokenId}`);
      if (st.used) {
        clearInterval(state.qrTimer);
        $('qr-status').innerHTML = '✅ <b>Записан в боте</b> — дальше он выбирает дату сам';
        if (state.qr && state.qr.idx < state.qr.ids.length - 1) setTimeout(() => { if ($('qr-box')) openTgQr(state.qr.ids, state.qr.idx + 1, state.qr.names); }, 1500);
        if (state.tab === 'trainer') loadTrainer(true);
      }
    } catch { /* keep polling */ }
  }, 4000);
}
async function openPdQr() {
  modal(`${modalHead('🪪 Персональные данные для площадок')}<div class="qr-box" id="pd-box"><div class="loading">…</div></div>
    <div class="small muted" style="text-align:center" id="pd-url"></div>
    <div class="modal-footer"><button class="btn btn-ghost" data-act="close-modal">Готово</button></div>`);
  try { const d = await api('GET', '/recruiting/trainer/pd-form'); drawQr('pd-box', d.url, d.qr_svg); $('pd-url').textContent = d.url; }
  catch (e) { $('pd-box').innerHTML = `<div style="color:#c33;padding:10px">${esc(e.message)}</div>`; }
}

// Tasks (checklist items) for recruiter / trainer / venue manager — on «Сегодня» and in «Мои задачи».
function internTasksBlock(tasks, helper) {
  if (!tasks.length) return helper ? '<div class="empty">Задач по стажёрам нет 👌</div>' : '';
  const byWho = {};
  for (const t of tasks) (byWho[t.who] = byWho[t.who] || []).push(t);
  return Object.entries(byWho).map(([who, list]) => {
    const people = R.groupTasks(list);
    return `<div class="section-title">🎓 ${esc(helper ? R.WHO[who] : 'Стажёры — ' + (R.WHO[who] || '').toLowerCase())}
      <span class="badge" style="background:var(--bg3);color:var(--text2)">${list.length}</span></div>
    <div class="today-grid">${people.map(g => internTaskCard(g, helper)).join('')}</div>`;
  }).join('');
}
function internTaskCard(g, helper) {
  const t = g.items[0];
  const when = t.outing_date ? '📅 ' + R.dayLabel(t.outing_date) + (t.venue_name ? ' · ' + t.venue_name : '') : t.training_date ? '🧑‍🏫 тренинг ' + R.dayLabel(t.training_date) : '';

    const main = x.item === 'outing_confirm' ? `<button class="btn btn-ok btn-sm" data-act="outing-status" data-outing="${esc(x.outing_id)}" data-status="done">✓ был</button>
        <button class="btn btn-warn btn-sm" data-act="outing-status" data-outing="${esc(x.outing_id)}" data-status="no_show">✗ нет</button>`
      : x.item === 'handed_to_hr' ? `<button class="btn btn-ok btn-sm" data-act="handover" data-id="${esc(x.candidate_id)}">→ в HR</button>`
        : x.item === 'outing1_booked' ? `<button class="btn btn-primary btn-sm" data-act="outing-new" data-id="${esc(x.candidate_id)}">📅 Записать</button>`
          : `<button class="btn btn-ok btn-sm" data-act="check-item" data-id="${esc(x.candidate_id)}" data-item="${esc(x.item)}" data-done="1" title="Отметить сделанным">✓</button>`;
    return `<div class="chk st-due" style="align-items:center;flex-wrap:wrap"><span style="flex:1 1 160px;min-width:0">${esc(x.label)}${x.outing_date && x.item === 'outing_confirm' ? ' · ' + esc(R.dayLabel(x.outing_date)) : ''}</span>
      ${x.item === 'telegram_linked' ? `<button class="btn btn-ghost btn-sm" data-act="tg-qr" data-id="${esc(x.candidate_id)}" data-name="${esc(x.name)}">📱 QR</button>` : ''}

        ${when ? `<span>${esc(when)}</span>` : ''}${!helper && t.assigned_to_name && isLead() ? `<span>👤 ${esc(t.assigned_to_name)}</span>` : ''}
        ${t.manager_name ? `<span>менеджер: ${esc(t.manager_name)}</span>` : ''}</div></div></div>
    <div>${g.items.map(action).join('')}</div></div>`;
}

    <div class="grid2">
      <div class="panel">
        <div class="field"><div class="fl">Бот Лайки (ник)</div><div style="display:flex;gap:6px"><input class="fin" id="set-laika_bot" value="${esc(s.laika_bot || '')}"/><button class="btn btn-ghost btn-sm" data-act="set-save" data-key="laika_bot">✓</button></div></div>
        <div class="field"><div class="fl">Форма персональных данных (QR на тренинге)</div><div style="display:flex;gap:6px"><input class="fin" id="set-pd_form_url" value="${esc(s.pd_form_url || '')}" placeholder="https://forms.gle/…"/><button class="btn btn-ghost btn-sm" data-act="set-save" data-key="pd_form_url">✓</button></div></div>
        <div class="field"><div class="fl">Чат стажёров — ссылка-приглашение (для шаблона)</div><div style="display:flex;gap:6px"><input class="fin" id="set-intern_chat_url" value="${esc(s.intern_chat_url || '')}" placeholder="https://t.me/+…"/><button class="btn btn-ghost btn-sm" data-act="set-save" data-key="intern_chat_url">✓</button></div></div>
        <div class="field"><div class="fl">На сколько дней вперёд записывать</div><div style="display:flex;gap:6px"><input class="fin" type="number" min="3" max="60" id="set-booking_days" value="${Number(s.booking_days) || 14}"/><button class="btn btn-ghost btn-sm" data-act="set-save" data-key="booking_days">✓</button></div></div>
        <div class="field"><div class="fl">Причины отказа (по строке)</div>${ta('reject_reasons', (s.reject_reasons || []).join('\n'), 6)}<button class="btn btn-ghost btn-sm" data-act="set-save" data-key="reject_reasons">Сохранить</button></div>
        <div class="field"><div class="fl">Причины резерва (по строке)</div>${ta('reserve_reasons', (s.reserve_reasons || []).join('\n'), 5)}<button class="btn btn-ghost btn-sm" data-act="set-save" data-key="reserve_reasons">Сохранить</button></div>
      </div>
      <div class="panel">
        <div class="howto" style="margin-bottom:8px">Подстановки: <code>{имя}</code> <code>{рекрутер}</code> <code>{дата_тренинга}</code> <code>{время_тренинга}</code> <code>{место_тренинга}</code> <code>{тренер}</code> <code>{дата}</code> <code>{площадка}</code> <code>{ссылка_бот}</code> <code>{чат_стажёров}</code></div>
        ${Object.entries(R.TEMPLATES).map(([k, l]) => `<div class="field"><div class="fl">${esc(l)}</div>${ta('tpl-' + k, (s.templates || {})[k] || '', 5)}</div>`).join('')}
        <button class="btn btn-primary btn-sm" data-act="set-save" data-key="templates">Сохранить шаблоны</button>
      </div>
    </div>
    <div class="section-title" style="margin-top:16px">Площадки, где нужны стажёры <span class="muted small">мест в день × мероприятия из расписания</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Площадка</th><th>Город</th><th class="num">Мест в день</th><th>Дни</th><th>Берём стажёров</th><th></th></tr></thead><tbody>
      ${venues.map(v => `<tr><td>${esc(v.name)}</td><td>${esc(v.city || '')}</td>
        <td class="num"><input class="fin" type="number" min="0" max="50" id="vr-cap-${esc(v.id)}" value="${v.capacity == null ? 1 : Number(v.capacity)}" style="width:70px"/></td>
        <td><select class="fselect" id="vr-days-${esc(v.id)}">${opt('all', 'все', !v.days || v.days === 'all')}${opt('weekend', 'выходные', v.days === 'weekend')}${opt('weekday', 'будни', v.days === 'weekday')}</select></td>
        <td><select class="fselect" id="vr-on-${esc(v.id)}">${opt('1', 'да', v.enabled)}${opt('0', 'нет', !v.enabled)}</select></td>
        <td><button class="btn btn-ghost btn-sm" data-act="vr-save" data-venue="${esc(v.id)}">✓</button></td></tr>`).join('')}
    </tbody></table></div>`;
}
async function saveSetting(key) {
  let value;
  if (key === 'templates') value = Object.fromEntries(Object.keys(R.TEMPLATES).map(k => [k, $('set-tpl-' + k).value]));
  else if (key === 'reject_reasons' || key === 'reserve_reasons') value = $('set-' + key).value.split('\n').map(x => x.trim()).filter(Boolean);
  else if (key === 'booking_days') value = Number($('set-' + key).value);
  else value = $('set-' + key).value.trim() || null;
  try { const s = await api('PUT', `/recruiting/settings/${key}`, { value }); META.interns.settings = s; toast('Сохранено'); }
  catch (e) { toast(e.message, true); }
}

// ── EVENTS (delegation; ids only in data-* attributes) ──
document.addEventListener('click', async e => {
  const tab = e.target.closest('.tab');
  if (tab) { showTab(tab.dataset.tab); return; }
  if (e.target === $('drawer-bg')) { closeCard(); return; }
  if (e.target === $('modal')) { closeModal(); return; }
  if (e.target === $('admin-overlay')) { closeAdmin(); return; }
  // Links (tel:, WhatsApp, Telegram, resume) work as links, also inside a clickable card.
  if (e.target.closest('a[href]')) return;
  // Row checkboxes select, they do not open the card.
  if (e.target.closest('[data-stop]') || e.target.closest('input[type=checkbox]')) return;
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'logout': doLogout(); break;
    case 'open-admin': openAdmin(); break;
    case 'new-candidate': openNew(); break;
    case 'create': createCandidate(false); break;
    case 'create-anyway': createCandidate(true); break;
    case 'open-dup': closeModal(); openCard(d.id); break;
    case 'open': openCard(d.id); break;
    case 'close-card': closeCard(); break;
    case 'close-modal': closeModal(); break;
    case 'toggle-filters': $('filters').classList.toggle('open'); break;
    case 'toggle-flag': state.filters[d.flag] = state.filters[d.flag] === '1' ? '' : '1'; applyFilters(); break;
    case 'reset-filters': state.filters = {}; $('f-period').value = ''; applyFilters(); break;
    case 'toggle-imported': state.filters.imported = state.filters.imported === '0' ? '1' : state.filters.imported === '1' ? '' : '0'; applyFilters(); break;
    case 'save-view': {
      const name = prompt('Название вида (например «Мои просроченные — Москва»)'); if (!name) break;
      try { await api('POST', '/recruiting/views', { name, view: state.tab === 'list' ? 'list' : 'board', filters: state.filters, is_shared: isLead() && confirm('Показать этот вид всем рекрутерам?') }); toast('Вид сохранён'); loadViews(); }
      catch (err) { toast(err.message, true); } break;
    }
    case 'show-rejected': state.showRejected = true; loadBoard(); break;
    case 'm-stage': state.mobileStage = d.id; document.querySelectorAll('.stage-chips .fchip').forEach(x => x.classList.toggle('on', x.dataset.id === d.id));
      document.querySelectorAll('.board-desktop .col').forEach(col => col.classList.toggle('m-active', col.querySelector('.col-b').dataset.stage === d.id)); break;
    case 'next-stage': {
      const c = state.card && state.card.id === d.id ? state.card : (await api('GET', `/candidates/${d.id}`));
      const n = R.nextStage(META.stages, c.stage_id); if (n) moveFlow(d.id, n.id); break;
    }
    case 'page': state.list.offset = Math.max(0, state.list.offset + Number(d.dir) * 50); loadList(); break;
    case 'bulk-clear': state.list.selected.clear(); loadList(); break;
    case 'bulk-tag': { const t = prompt('Тег для выбранных'); if (t) bulkUpdate({ add_tags: [t.replace(/^#/, '')] }); break; }
    case 'call-result': callResult(d.id, d.result, d.rem || null); break;
    case 'remind': openRemind(d.id, null); break;
    case 'snooze': openRemind(state.card ? state.card.id : null, d.rem, '⏰ Перенести звонок'); break;
    case 'preset': $('r-at').value = R.toLocalInput(R.presetDate(d.preset)); break;
    case 'save-remind': saveRemind(d.id || null, d.rem || null); break;
    case 'rem-done': case 'rem-cancel':
      try { await api('PATCH', `/recruiting/reminders/${d.rem}`, { status: d.act === 'rem-done' ? 'done' : 'cancelled' }); refreshAfterChange(state.card && state.card.id); } catch (err) { toast(err.message, true); } break;
    case 'reject': openReject(d.id); break;
    case 'confirm-reject': confirmReject(d.id); break;
    case 'take': try { await api('POST', `/candidates/${d.id}/take`); toast('Теперь кандидат ваш'); refreshAfterChange(d.id); } catch (err) { toast(err.message, true); } break;
    case 'edit': openEdit(state.card); break;
    case 'save-edit': saveEdit(d.id); break;
    case 'comment': addComment(d.id); break;
    case 'tag-del': try { await api('PATCH', `/candidates/${state.card.id}`, { tags: (state.card.tags || []).filter(t => t !== d.tag) }); openCard(state.card.id, true); } catch (err) { toast(err.message, true); } break;
    case 'file-dl': downloadFile(d.file, d.name); break;
    case 'file-del': if (confirm('Удалить файл из карточки?')) { try { await api('DELETE', `/recruiting/files/${d.file}`); openCard(state.card.id, true); } catch (err) { toast(err.message, true); } } break;
    case 'tp-pick': closeModal(); doMove(d.id, d.stage, { training_id: d.training, internship_date: d.date || undefined }, state.afterPick); break;
    case 'tp-skip': { const date = $('tp-date') ? $('tp-date').value : ''; closeModal(); doMove(d.id, d.stage, date ? { internship_date: date } : {}, state.afterPick); break; }
    case 'trainings': openTrainings(); break;
    case 'training-create':
      try { await api('POST', '/trainings', { title: $('tr-title').value.trim(), training_date: $('tr-date').value, training_time: $('tr-time').value || null, trainer_id: $('tr-trainer').value,
        max_attendees: Number($('tr-max').value) || null, location_text: $('tr-loc').value.trim() || null, training_type: /стаж/i.test($('tr-title').value) ? 'internship' : 'onboarding' });
        toast('Создан'); openTrainings(); } catch (err) { toast(err.message, true); } break;
    case 'vacancy-new': openVacancy(null); break;
    case 'vacancy-edit': openVacancy(d.id); break;
    case 'vacancy-save': saveVacancy(d.id || null); break;
    case 'vacancy-filter': closeModal(); state.filters = { vacancy_id: d.id }; showTab('list'); fillFilterControls(); break;
    case 'kpi-period': state.kpi.period = d.period; loadKpi(); break;
    case 'imp-remap': state.importMapping = Object.fromEntries([...document.querySelectorAll('.imp-map')].filter(s => s.value).map(s => [s.dataset.col, s.value])); importPreview(); break;
    case 'imp-commit': importCommit(); break;
    case 'imp-cancel': if (state.importJob) { await api('POST', `/recruiting/import/${state.importJob.job_id}/cancel`).catch(() => {}); } state.importJob = null; renderImport(); break;
    case 'merge': merge(d.group, d.ids); break;
    case 'hh-connect': try { const r = await api('POST', '/recruiting/integrations/hh/connect'); window.location.href = r.authorize_url; } catch (err) { toast(err.message, true); } break;
    case 'int-check': case 'int-dry': case 'int-sync': case 'int-off': integration(d.act, d.p); break;
    case 'stage-new': openStageNew(); break;
    case 'stage-save':
      try { await api('POST', '/recruiting/stages', { name: $('s-name').value.trim(), funnel: $('s-funnel').value, kpi_step: $('s-step').value || null, color: $('s-color').value,
        is_terminal: !!$('s-type').value, terminal_type: $('s-type').value || null }); closeModal(); META = await api('GET', '/recruiting/meta'); loadSettings(); } catch (err) { toast(err.message, true); } break;
    // ── interns funnel ──
    case 'check-item': await checkItem(d.id, d.item, true); break;
    case 'outing-status': await outingUpdate(d.outing, { status: d.status }); break;
    case 'outing-feedback': { const f = prompt('Обратная связь по выходу (что получилось, что подтянуть)'); if (f != null) await outingUpdate(d.outing, { feedback: f }); break; }
    case 'outing-new': openOutingPicker(d.id); break;
    case 'op-pick': bookOuting(d.id, d.date, d.venue, false); break;
    case 'op-manual': { const date = $('op-date').value; const v = $('op-venue').value; if (!date || !v) { toast('Укажите дату и площадку', true); break; } bookOuting(d.id, date, v, $('op-force') && $('op-force').checked); break; }
    case 'op-skip': closeModal(); doMove(d.id, d.stage, {}, state.afterPick); break;
    case 'tg-qr': openTgQr([d.id], 0, d.name ? { [d.id]: d.name } : {}); break;
    case 'tg-qr-all': if (state.trainer.people && state.trainer.people.length) openTgQr(state.trainer.people, 0, state.trainer.names); break;
    case 'qr-step': if (state.qr) openTgQr(state.qr.ids, Math.max(0, Math.min(state.qr.ids.length - 1, state.qr.idx + Number(d.dir))), state.qr.names); break;
    case 'pd-qr': openPdQr(); break;
    case 'tr-mine': state.trainer.mine = !state.trainer.mine; loadTrainer(); break;
    case 'trainee-link': case 'trainee-unlink':
      try { await api('PATCH', `/candidates/${d.id}`, { trainee_photographer_id: d.act === 'trainee-link' ? d.ph : null }); toast(d.act === 'trainee-link' ? 'Карточка стажёра привязана' : 'Отвязана'); openCard(d.id, true); } catch (err) { toast(err.message, true); } break;
    case 'trainee-create':
      if (!confirm('Создать карточку в «Команде» с грейдом «Стажёр»? Её можно ставить на смены — выходы посчитаются сами.')) break;
      try { await api('POST', `/recruiting/candidates/${d.id}/trainee-card`); toast('Карточка стажёра создана'); openCard(d.id, true); } catch (err) { toast(err.message, true); } break;
    case 'handover': { const st = stageByCode('handover'); if (!st) { toast('Нет этапа «Передан в HR»', true); break; } if (!state.card || state.card.id !== d.id) await openCard(d.id); moveFlow(d.id, st.id); break; }
    case 'reserve': openReject(d.id, null, null, true); break;
    case 'pick-training': pickTraining(d.id, state.card ? state.card.stage_id : null, false); break;
    case 'tpl-open': openTemplate(d.key); break;
    case 'open-tpl': await openCard(d.id); openTemplate(d.key); break;
    case 'tpl-copy': copyText($('tpl-text').value); break;
    case 'in-days': state.interns.days = Number(d.days); loadInterns(); break;
    case 'slot-new': openSlotNew(); break;
    case 'slot-save':
      try { await api('POST', '/recruiting/intern-slots', { date: $('sl-date').value, venue_id: $('sl-venue').value, capacity: Number($('sl-cap').value), note: $('sl-note').value.trim() || null });
        closeModal(); toast('Места сохранены'); loadInterns(); } catch (err) { toast(err.message, true); } break;
    case 'slot-del': try { await api('PATCH', `/recruiting/intern-slots/${d.slot}`, { is_active: false }); loadInterns(); } catch (err) { toast(err.message, true); } break;
    case 'vr-save':
      try { await api('PUT', `/recruiting/intern-venues/${d.venue}`, { capacity: Number($('vr-cap-' + d.venue).value), days: $('vr-days-' + d.venue).value, enabled: $('vr-on-' + d.venue).value === '1' }); toast('Сохранено'); }
      catch (err) { toast(err.message, true); } break;
    case 'set-save': saveSetting(d.key); break;
    case 'ik-by': state.kpi.internBy = d.by; loadKpi(); break;
    case 'stage-up': moveStage(Number(d.i), -1); break;
    case 'stage-down': moveStage(Number(d.i), 1); break;
  }
});
// Checklist / attendance checkboxes (clicks on checkboxes are not handled by the click delegation above).
document.addEventListener('change', e => {
  const cb = e.target.closest && e.target.closest('input[type=checkbox][data-act="check-item"]');
  if (cb) checkItem(cb.dataset.id, cb.dataset.item, cb.checked, cb);
});
async function checkItem(id, item, done, cb) {
  try {
    await api('POST', `/recruiting/candidates/${id}/checklist/${item}`, { done });
    toast(done ? '✓ Отмечено' : 'Отметка снята');
    if (state.card && state.card.id === id && $('drawer-bg').classList.contains('open')) await openCard(id, true);
    if (state.tab === 'trainer') loadTrainer(true); else if (state.tab === 'tasks') loadTasks(); else if (state.tab === 'today') loadToday();
    else if (state.tab === 'board') loadBoard();
    refreshTodayCount();
  } catch (err) { if (cb) cb.checked = !done; toast(err.message, true); }
}
async function outingUpdate(outingId, body) {
  try {
    await api('PATCH', `/recruiting/outings/${outingId}`, body);
    toast(body.status ? 'Выход: ' + (R.OUT[body.status] || body.status) : 'Сохранено');
    if (state.card && $('drawer-bg').classList.contains('open')) await openCard(state.card.id, true);
    if (state.tab === 'tasks') loadTasks(); else if (state.tab === 'today') loadToday(); else if (state.tab === 'interns') loadInterns(); else if (state.tab === 'board') loadBoard();
    refreshTodayCount();
  } catch (err) { toast(err.message, true); }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('modal').classList.contains('open')) closeModal(); else if ($('drawer-bg').classList.contains('open')) closeCard(); } });

function openAdmin() { const ov = $('admin-overlay'); $('admin-iframe').src = 'admin.html?v=' + Date.now(); ov.style.display = 'flex'; document.body.style.overflow = 'hidden'; }
function closeAdmin() { $('admin-overlay').style.display = 'none'; $('admin-iframe').src = ''; document.body.style.overflow = ''; }
</script>
</body>
</html>
